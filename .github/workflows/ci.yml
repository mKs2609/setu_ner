name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  # Builds the production API image exactly as a host would, from the repo
  # root. Catches a Dockerfile COPY of a moved file, or a dependency that
  # stops shipping a wheel -- neither of which the test job would notice.
  # The image is only built, never pushed.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t setuner-api:ci .
      - name: Artifacts are inside the image
        run: |
          docker run --rm -i setuner-api:ci python - <<'PY'
          from app.services.model import district_model as dm
          from app.services.logistics import gazetteer
          from app.db.migrate import migration_files
          assert all(dm.load(h) for h in dm.HORIZONS), "model artifacts missing"
          assert gazetteer.GAZETTEER_PATH.exists(), "gazetteer missing"
          assert migration_files(), "migrations missing"
          print("artifacts ok")
          PY
      - name: Refuses an unsafe production config
        run: |
          if docker run --rm -e ENVIRONMENT=production setuner-api:ci python -c "import app.main"; then
            echo "expected startup to be refused"; exit 1
          fi

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose -- package.json's "packageManager"
      # field (pnpm@9.11.0) is the single source of truth. Declaring it in
      # both places fails with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @setu_ner/web lint
      - name: Type check
        run: pnpm --filter @setu_ner/web type-check
      - name: Build
        run: pnpm --filter @setu_ner/web build
