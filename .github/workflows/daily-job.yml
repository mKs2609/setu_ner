# The daily job (app/jobs/daily.py) on GitHub's scheduler: ingest missing
# DRIMS report days, match damage to roads, re-score accessibility -- against
# the hosted database.
#
# Free for a public repository, and no extra host to run. Needs one repository
# secret, DATABASE_URL (Settings -> Secrets and variables -> Actions). Without
# it the job skips rather than failing.
#
# GitHub disables scheduled workflows in repositories with no activity for 60
# days; re-enable it from the Actions tab if that happens. A failed run emails
# the repo owner, which is the alert for a stale forecast.

name: Daily job

on:
  schedule:
    # 20:30 UTC = 02:00 IST. DRIMS publishes late in the day.
    - cron: "30 20 * * *"
  workflow_dispatch: {}

# Never two at once: overlapping runs would both hit the government portal.
concurrency:
  group: daily-job
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip when not configured
        id: configured
        # Runs before checkout, so not in apps/api (which does not exist yet).
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.configured.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        if: steps.configured.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Run the daily job
        if: steps.configured.outputs.ok == 'true'
        run: python -m app.jobs.daily
