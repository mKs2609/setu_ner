<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Setu is a bridge. At 16px only two strokes survive legibly, so it is the
       deck and the arch beneath it: anything more turns to mush in a tab. -->
  <rect width="32" height="32" rx="7" fill="#6f4fc9"/>
  <path d="M 3.5 13 H 28.5" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 6 24 Q 16 9.5 26 24" stroke="#ffffff" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
