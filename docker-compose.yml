version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sih26002}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih26002}
      POSTGRES_DB: ${POSTGRES_DB:-sih26002}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih26002}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sih26002}:${POSTGRES_PASSWORD:-sih26002}@postgres:5432/${POSTGRES_DB:-sih26002}
    depends_on:
      postgres:
        condition: service_healthy
      # The Phase 3 model artifacts live at the repo root, outside the API's
      # build context. See app/services/model/district_model.py.
      SETUNER_MODEL_DIR: /models
      SETUNER_GAZETTEER: /gazetteer/corridor_places.json
    volumes:
      - ./apps/api:/app
      - ./ml/models:/models:ro
      - ./geo/gazetteer:/gazetteer:ro

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  # Daily hazard ingestion. Behind a profile so a normal `docker compose up`
  # does not start it -- ingestion hits a government portal, and that should
  # be a deliberate choice rather than a side effect of bringing the stack up.
  #
  #   docker compose --profile scheduling up -d ingestion
  #
  # It sleeps rather than running cron so the container stays single-purpose
  # and its output lands in `docker compose logs` like everything else.
  # --catch-up means a container that was down for a week recovers that week.
  ingestion:
    build: ./apps/api
    profiles: ["scheduling"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sih26002}:${POSTGRES_PASSWORD:-sih26002}@postgres:5432/${POSTGRES_DB:-sih26002}
      SETUNER_MODEL_DIR: /models
    volumes:
      - ./ml/models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c 'while true; do
        echo "[$(date -Iseconds)] ingestion starting";
        python -m app.services.ingestion.run --hazard flood --catch-up || true;
        python -m app.services.ingestion.run --hazard landslide --catch-up || true;
        python -m app.services.model.damage_matching || true;
        python -m app.services.model.score || true;
        echo "[$(date -Iseconds)] sleeping 24h";
        sleep 86400;
      done'

volumes:
  postgres_data:

# Not on Day 1 (see docs/decisions/0001-master-reference §20):
# Redis, background worker, MinIO/object storage -- add when a phase
# actually needs them, not before.
