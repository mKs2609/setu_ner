version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-setuner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setuner}
      POSTGRES_DB: ${POSTGRES_DB:-setuner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setuner}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # Context is the repo root: the image needs ml/models, geo/gazetteer and
    # infra/migrations as well as apps/api (see apps/api/Dockerfile).
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-setuner}:${POSTGRES_PASSWORD:-setuner}@postgres:5432/${POSTGRES_DB:-setuner}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Live-reload the code in development; artifacts come from the image.
      - ./apps/api/app:/app/app

  # No web container: apps/web has no Dockerfile and deploys to Vercel. Run it
  # locally with `pnpm --filter @setu_ner/web dev` against this API.

  # Daily hazard ingestion. Behind a profile so a normal `docker compose up`
  # does not start it -- ingestion hits a government portal, and that should
  # be a deliberate choice rather than a side effect of bringing the stack up.
  #
  #   docker compose --profile scheduling up -d ingestion
  #
  # It sleeps rather than running cron so the container stays single-purpose
  # and its output lands in `docker compose logs` like everything else.
  # --catch-up means a container that was down for a week recovers that week.
  ingestion:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["scheduling"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-setuner}:${POSTGRES_PASSWORD:-setuner}@postgres:5432/${POSTGRES_DB:-setuner}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Same entrypoint as every other scheduler (app/jobs/daily.py).
    command: >
      sh -c 'while true; do
        python -m app.jobs.daily || true;
        echo "sleeping 24h";
        sleep 86400;
      done'

volumes:
  postgres_data:

# Not on Day 1 (see docs/decisions/0001-master-reference §20):
# Redis, background worker, MinIO/object storage -- add when a phase
# actually needs them, not before.
