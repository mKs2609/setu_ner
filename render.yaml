# Render blueprint for the SetuNER API (free instance type).
#
# Render reads this from the repo root: New -> Blueprint -> pick this repo.
# It builds the same image as apps/api/Dockerfile, from the repo root context
# so the model artifacts, gazetteer and migrations are included.
#
# FREE TIER, HONESTLY
#   512 MB RAM.  Measured: ~120 MB idle, ~260 MB after a full four-depot plan
#                (the road graph is cached after the first request). Routing
#                keeps predecessors rather than every junction's path, which
#                costs ~4 MB per depot instead of ~109 MB -- the first
#                deployment's 502 was that spike. MAX_CONCURRENT_PLANS is 1
#                here so two simultaneous plans queue instead of competing.
#   Sleeps after 15 minutes idle; the next request waits ~50 s for a cold
#   start, and the first plan after that rebuilds the graph (~1 s).
#   No cron on the free tier -- the daily job runs on GitHub Actions instead
#   (.github/workflows/daily-job.yml).
#
# The four secret-ish values are marked sync:false, so Render asks for them in
# the dashboard instead of keeping them in git.

services:
  - type: web
    name: setuner-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MAX_CONCURRENT_PLANS
        value: "1"
      - key: PUBLIC_FIELD_REPORTS
        value: "false"
      - key: DATABASE_URL
        sync: false
      # Plain values are fine: "https://your-app.vercel.app" and a bare hash.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPERATOR_TOKEN_HASHES
        sync: false
