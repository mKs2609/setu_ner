<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="SetuNER architecture in five stages: data sources, ingestion, a PostGIS store, the model and relief planner, and the API and map that serve them — with a daily job and an independent watcher underneath.">
<rect width="1000" height="490" fill="#131118"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#f1eff7">SetuNER — how a government PDF becomes a route</text>
<text x="24" y="54" font-size="11.5" fill="#9d97ad">Every stage records what it did, so a failure shows up as a failure rather than as an empty map.</text>
<text x="24" y="90" font-size="9" font-weight="700" fill="#a98ae8">1</text>
<text x="38" y="90" font-size="12.5" font-weight="700" fill="#f1eff7">Sources</text>
<text x="24" y="107" font-size="8.6" letter-spacing="0.7" fill="#9d97ad">FOUR FEEDS</text>
<rect x="24" y="112" width="180" height="243" rx="7" fill="#1c1926" stroke="#302a40"/>
<rect x="33" y="121" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="43" y="132" font-size="10.8" font-weight="600" fill="#f1eff7">ASDMA DRIMS</text>
<text x="43" y="145" font-size="9.3" fill="#9d97ad">daily flood PDF — the one</text>
<text x="43" y="156" font-size="9.3" fill="#9d97ad">scraped source</text>
<rect x="33" y="169" width="2.5" height="24" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="43" y="180" font-size="10.8" font-weight="600" fill="#f1eff7">NASA GPM IMERG</text>
<text x="43" y="193" font-size="9.3" fill="#9d97ad">satellite rainfall over OPeNDAP</text>
<rect x="33" y="206" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="43" y="217" font-size="10.8" font-weight="600" fill="#f1eff7">OpenStreetMap</text>
<text x="43" y="230" font-size="9.3" fill="#9d97ad">road graph via Overpass ·</text>
<text x="43" y="241" font-size="9.3" fill="#9d97ad">one-off</text>
<rect x="33" y="254" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="43" y="265" font-size="10.8" font-weight="600" fill="#f1eff7">Copernicus DEM</text>
<text x="43" y="278" font-size="9.3" fill="#9d97ad">elevation by range request ·</text>
<text x="43" y="289" font-size="9.3" fill="#9d97ad">one-off</text>
<path d="M 210 233.5 L 232 233.5" stroke="#4a4259" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text x="240" y="90" font-size="9" font-weight="700" fill="#a98ae8">2</text>
<text x="254" y="90" font-size="12.5" font-weight="700" fill="#f1eff7">Ingestion</text>
<text x="240" y="107" font-size="8.6" letter-spacing="0.7" fill="#9d97ad">DATA ENGINEERING</text>
<rect x="240" y="112" width="172" height="243" rx="7" fill="#1c1926" stroke="#302a40"/>
<rect x="249" y="121" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="259" y="132" font-size="10.8" font-weight="600" fill="#f1eff7">Polite client</text>
<text x="259" y="145" font-size="9.3" fill="#9d97ad">robots.txt, crawl delay, size</text>
<text x="259" y="156" font-size="9.3" fill="#9d97ad">caps</text>
<rect x="249" y="169" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="259" y="180" font-size="10.8" font-weight="600" fill="#f1eff7">PDF parser</text>
<text x="259" y="193" font-size="9.3" fill="#9d97ad">pdfplumber + district-name</text>
<text x="259" y="204" font-size="9.3" fill="#9d97ad">repair</text>
<rect x="249" y="217" width="2.5" height="24" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="259" y="228" font-size="10.8" font-weight="600" fill="#f1eff7">Grid alignment check</text>
<text x="259" y="241" font-size="9.3" fill="#9d97ad">refuses a grid whose axes moved</text>
<rect x="249" y="254" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="259" y="265" font-size="10.8" font-weight="600" fill="#f1eff7">Run log</text>
<text x="259" y="278" font-size="9.3" fill="#9d97ad">written before each attempt</text>
<text x="259" y="289" font-size="9.3" fill="#9d97ad">starts</text>
<path d="M 418 233.5 L 440 233.5" stroke="#4a4259" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text x="448" y="90" font-size="9" font-weight="700" fill="#a98ae8">3</text>
<text x="462" y="90" font-size="12.5" font-weight="700" fill="#f1eff7">Store</text>
<text x="448" y="107" font-size="8.6" letter-spacing="0.7" fill="#9d97ad">DATA MODELLING</text>
<rect x="448" y="112" width="150" height="243" rx="7" fill="#1c1926" stroke="#302a40"/>
<rect x="457" y="121" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="467" y="132" font-size="10.8" font-weight="600" fill="#f1eff7">PostgreSQL 16</text>
<text x="467" y="145" font-size="9.3" fill="#9d97ad">+ PostGIS 3.3 · Neon,</text>
<text x="467" y="156" font-size="9.3" fill="#9d97ad">Singapore</text>
<rect x="457" y="169" width="2.5" height="24" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="467" y="180" font-size="10.8" font-weight="600" fill="#f1eff7">110,266 roads</text>
<text x="467" y="193" font-size="9.3" fill="#9d97ad">graph, terrain, gazetteer</text>
<rect x="457" y="206" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="467" y="217" font-size="10.8" font-weight="600" fill="#f1eff7">336 daily reports</text>
<text x="467" y="230" font-size="9.3" fill="#9d97ad">observations, runs,</text>
<text x="467" y="241" font-size="9.3" fill="#9d97ad">forecasts</text>
<rect x="457" y="254" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="467" y="265" font-size="10.8" font-weight="600" fill="#f1eff7">Idempotent migrations</text>
<text x="467" y="278" font-size="9.3" fill="#9d97ad">re-runnable, applied on</text>
<text x="467" y="289" font-size="9.3" fill="#9d97ad">boot</text>
<path d="M 604 233.5 L 626 233.5" stroke="#4a4259" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text x="634" y="90" font-size="9" font-weight="700" fill="#a98ae8">4</text>
<text x="648" y="90" font-size="12.5" font-weight="700" fill="#f1eff7">Model &amp; planning</text>
<text x="634" y="107" font-size="8.6" letter-spacing="0.7" fill="#9d97ad">ML + OPTIMISATION</text>
<rect x="634" y="112" width="180" height="243" rx="7" fill="#1c1926" stroke="#302a40"/>
<rect x="643" y="121" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="653" y="132" font-size="10.8" font-weight="600" fill="#f1eff7">Flood-state model</text>
<text x="653" y="145" font-size="9.3" fill="#9d97ad">logistic at 1 day, persistence</text>
<text x="653" y="156" font-size="9.3" fill="#9d97ad">at 3</text>
<rect x="643" y="169" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="653" y="180" font-size="10.8" font-weight="600" fill="#f1eff7">Shadow challenger</text>
<text x="653" y="193" font-size="9.3" fill="#9d97ad">with rainfall · frozen, not</text>
<text x="653" y="204" font-size="9.3" fill="#9d97ad">served</text>
<rect x="643" y="217" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="653" y="228" font-size="10.8" font-weight="600" fill="#f1eff7">Per-road scoring</text>
<text x="653" y="241" font-size="9.3" fill="#9d97ad">terrain exposure prior · 71,520</text>
<text x="653" y="252" font-size="9.3" fill="#9d97ad">roads</text>
<rect x="643" y="265" width="2.5" height="24" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="653" y="276" font-size="10.8" font-weight="600" fill="#f1eff7">Relief planner</text>
<text x="653" y="289" font-size="9.3" fill="#9d97ad">OR-Tools lexicographic LP</text>
<path d="M 820 233.5 L 842 233.5" stroke="#4a4259" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text x="850" y="90" font-size="9" font-weight="700" fill="#a98ae8">5</text>
<text x="864" y="90" font-size="12.5" font-weight="700" fill="#f1eff7">Serve</text>
<text x="850" y="107" font-size="8.6" letter-spacing="0.7" fill="#9d97ad">BACKEND + FRONTEND</text>
<rect x="850" y="112" width="126" height="243" rx="7" fill="#1c1926" stroke="#302a40"/>
<rect x="859" y="121" width="2.5" height="24" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="869" y="132" font-size="10.8" font-weight="600" fill="#f1eff7">FastAPI</text>
<text x="869" y="145" font-size="9.3" fill="#9d97ad">31 endpoints · Render</text>
<rect x="859" y="158" width="2.5" height="24" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="869" y="169" font-size="10.8" font-weight="600" fill="#f1eff7">Next.js 14</text>
<text x="869" y="182" font-size="9.3" fill="#9d97ad">MapLibre GL · Vercel</text>
<rect x="859" y="195" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="869" y="206" font-size="10.8" font-weight="600" fill="#f1eff7">Every number</text>
<text x="869" y="219" font-size="9.3" fill="#9d97ad">carries its source</text>
<text x="869" y="230" font-size="9.3" fill="#9d97ad">and age</text>
<rect x="859" y="243" width="2.5" height="35" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="869" y="254" font-size="10.8" font-weight="600" fill="#f1eff7">Readiness endpoint</text>
<text x="869" y="267" font-size="9.3" fill="#9d97ad">ten checks · what</text>
<text x="869" y="278" font-size="9.3" fill="#9d97ad">Render gates on</text>
<rect x="859" y="291" width="2.5" height="46" rx="1.2" fill="#a98ae8" opacity="0.55"/>
<text x="869" y="302" font-size="10.8" font-weight="600" fill="#f1eff7">Field reports in</text>
<text x="869" y="315" font-size="9.3" fill="#9d97ad">public POST ·</text>
<text x="869" y="326" font-size="9.3" fill="#9d97ad">corroborated, never</text>
<text x="869" y="337" font-size="9.3" fill="#9d97ad">overwrite</text>
<path d="M 674 355 L 674 366 L 523.0 366 L 523.0 355" stroke="#4a4259" stroke-width="1.3" fill="none" stroke-dasharray="3 2.5" marker-end="url(#ar)"/>
<rect x="519.25" y="358" width="158.5" height="15" fill="#131118"/>
<text x="598.5" y="369" font-size="8.8" text-anchor="middle" fill="#9d97ad">scores and forecasts written back</text>
<rect x="24" y="389" width="952" height="81" rx="7" fill="#231f30" stroke="#302a40"/>
<text x="40" y="409" font-size="8.6" letter-spacing="0.7" fill="#9d97ad">OPERATIONS</text>
<text x="40" y="429" font-size="10.8" font-weight="600" fill="#f1eff7">Daily job — 07:30 IST, on a machine in India</text>
<text x="40" y="444" font-size="9.3" fill="#9d97ad">ASDMA does not answer hosts outside India, so the scheduler</text>
<text x="40" y="455" font-size="9.3" fill="#9d97ad">cannot live in the cloud. Catch-up fetches the oldest owed day</text>
<text x="40" y="466" font-size="9.3" fill="#9d97ad">first.</text>
<text x="512" y="429" font-size="10.8" font-weight="600" fill="#f1eff7">Watcher — GitHub Actions, four times a day</text>
<text x="512" y="444" font-size="9.3" fill="#9d97ad">Asks four questions and fails if any answer is wrong, so the</text>
<text x="512" y="455" font-size="9.3" fill="#9d97ad">failure is the alert. Deliberately not on the machine it</text>
<text x="512" y="466" font-size="9.3" fill="#9d97ad">watches.</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4259"/></marker></defs>
</svg>